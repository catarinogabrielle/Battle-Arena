<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battle Arena - Ranking System</title>
    <link rel="stylesheet" href="style-arena.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div id="damage-overlay"></div>
    <div id="spectator-ui" class="hidden">MODO ESPECTADOR: OBSERVANDO A BATALHA...</div>

    <header class="hud-top">
        <div class="hud-alive">
            <i class="fas fa-users"></i> VIVOS: <span id="alive-count" class="highlight">6</span>
        </div>
        <div class="hud-zone">
            <i class="fas fa-radiation-alt" style="color: #ff3d68;"></i> ZONA ATIVA
        </div>
        <button class="btn-leave" onclick="window.location.href='menu.html'">
            <i class="fas fa-sign-out-alt"></i> SAIR
        </button>
    </header>

    <canvas id="gameCanvas"></canvas>
    <aside class="kill-feed" id="kill-feed"></aside>

    <footer class="hud-bottom" id="player-hud">
        <div class="player-status p1-status">
            <div class="status-header">
                <span class="p-name">KAELEN</span>
                <span class="p-weapon">ESPADA LENDÁRIA</span>
            </div>
            <div class="hp-bar-container">
                <div class="hp-bar-fill" id="p1-hp-fill"></div>
            </div>
            <div class="attack-energy-container">
                <div id="p1-pips-container" class="pips-list"></div>
                <div id="p1-reloader" class="circular-loader hidden">
                    <div class="loader-inner"></div>
                </div>
                <span class="energy-text" id="p1-energy-text">5/5</span>
            </div>
        </div>
    </footer>

    <div id="game-over-screen" class="hidden overlay-screen">
        <h2 class="victory-title">PARTIDA FINALIZADA</h2>
        <h1 id="winner-text">ALGUÉM VENCEU!</h1>

        <div class="ranking-container">
            <h3>RANKING DA PARTIDA</h3>
            <div id="ranking-list">
            </div>
        </div>

        <div class="end-actions">
            <button class="btn-play-again" onclick="window.location.reload()">
                <i class="fas fa-redo"></i> JOGAR NOVAMENTE
            </button>
            <button class="btn-menu" onclick="window.location.href='menu.html'">MENU</button>
        </div>
    </div>

    <script src="script-arena.js"></script>
</body>

</html>
