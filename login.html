<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battle Arena Login</title>
    <link rel="stylesheet" href="style-login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="shortcut icon" href="assets/logo-los.png" type="image/x-icon">
    <style>
        #login-error {
            color: #ff3d68;
            font-size: 0.9em;
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            display: none;
            background: rgba(255, 61, 104, 0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ff3d68;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="game-logo">
            <img src="assets/logo-los.png" alt="Last One Standing Logo">
        </div>

        <div class="login-panel" id="main-panel">
            <form id="login-form">
                <div class="input-group">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" id="email" placeholder="name@example.com" required>
                </div>

                <div class="input-group">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="password" placeholder="********" required>
                </div>

                <button type="submit" class="login-button" id="btn-submit">
                    LOGIN <i class="fas fa-chevron-right button-arrow"></i>
                </button>

                <div id="login-error">Erro ao conectar!</div>
            </form>

            <div class="login-links" style="justify-content: center;">
                <a href="#">ESQUECEU A SENHA?</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', function (event) {
            event.preventDefault();

            const email = document.getElementById('email').value;
            const btn = document.getElementById('btn-submit');
            const errorDiv = document.getElementById('login-error');

            errorDiv.style.display = 'none';
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> AUTENTICANDO...';
            btn.disabled = true;

            setTimeout(() => {

                const mockPlayer = {
                    id: "teste_123",
                    username: "Jogador_Teste",
                    email: email,
                    coins: 500,
                    level: 10,
                    avatar: ""
                };

                localStorage.setItem('ygaming_token', 'token_estatico_de_teste');
                localStorage.setItem('arenaPlayerInfo', JSON.stringify(mockPlayer));

                btn.innerHTML = '<i class="fas fa-check"></i> CONECTADO!';

                setTimeout(() => {
                    window.location.href = 'menu.html';
                }, 500);

            }, 1000);
        });
    </script>
</body>

</html>
